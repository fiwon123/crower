changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚀 Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🛠️ Maintenance"
      labels:
        - chore
        - refactor
        - ci
        - test
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "Other Changes"
      labels:
        - "*"
