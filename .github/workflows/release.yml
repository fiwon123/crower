name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.5.0)'
        required: true
        type: string
      publish:
        description: 'Publish immediately (leave unchecked to create or refresh a DRAFT release)'
        required: false
        type: boolean
        default: false

permissions:
  # `contents: write` publishes the tag and the release. `pull-requests: read` is
  # what lets `gh pr list` build the changelog: a workflow that declares a
  # top-level `permissions:` block turns every other scope off, so without this
  # line the notes step would fail with a 403 and the release would publish an
  # empty changelog.
  contents: write
  pull-requests: read

# Two dispatches for the same version would race on the same tag and the same
# draft release.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
      previous_tag: ${{ steps.prev.outputs.previous_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch release branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Validate version and release source
        id: validate
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          # A release ships what main contains. When dev holds commits that main
          # does not, the artifacts silently omit them: that is how the v0.4.0
          # draft was cut from dev while this workflow would have built from a
          # main that lacked the add_to_path.sh fix.
          if ! git merge-base --is-ancestor origin/dev origin/main; then
            echo "dev has commits that main does not contain." >&2
            echo "Merge dev into main before releasing; see the release steps in AGENTS.md." >&2
            exit 1
          fi

          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "commit=$MAIN_COMMIT" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            EXISTING="$(git rev-list -n 1 "$VERSION")"
            if [ "$EXISTING" = "$MAIN_COMMIT" ]; then
              echo "$VERSION already tags main — the publish job will refresh that release."
              COMMIT="$EXISTING"
            elif git merge-base --is-ancestor "$EXISTING" "$MAIN_COMMIT"; then
              # The tag sits on main's history but main has moved (e.g. a fix
              # landed after the tag was cut). Build from the tagged tree so the
              # release matches what the tag points at; provenance still checks
              # against that commit. Warn that main contains later commits.
              OMITTED="$(git rev-list --count "${EXISTING}..${MAIN_COMMIT}")"
              echo "::warning::$VERSION tags $EXISTING, which is an ancestor of main ($MAIN_COMMIT). main is ahead by $OMITTED commit(s); building from the tagged tree."
              COMMIT="$EXISTING"
            else
              echo "Tag $VERSION already exists at $EXISTING, which is not on main ($MAIN_COMMIT)." >&2
              echo "Bump the version: a published tag is never moved." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION" "$MAIN_COMMIT"
            git push origin "$VERSION"
            COMMIT="$MAIN_COMMIT"
          fi

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get previous tag
        id: prev
        run: |
          # ^ skips a tag created on this commit, so the changelog does not
          # compare the release against itself.
          PREV=$(git describe --tags --abbrev=0 "${{ steps.validate.outputs.commit }}^" 2>/dev/null || echo "")
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"

  gui:
    # The Fyne GUI is a CGO build, so it cannot join a cross-compile matrix: it
    # runs on the target OS runner and packages the cgo-free CLI pair and
    # crower-gui into one archive. The two arm64 targets are handled by
    # gui-cross below.
    name: Build GUI ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install X11/GL and Wayland headers
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build the platform archive (Unix)
        if: matrix.goos != 'windows'
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: make release-gui-platform

      - name: Build the platform archive (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          New-Item -ItemType Directory -Force build/dist, build/gui-package | Out-Null

          $env:CGO_ENABLED = '0'
          go build -ldflags "-X github.com/fiwon123/crower/cmd.Version=$env:VERSION" -o build/crower.exe .
          Copy-Item build/crower.exe build/cr.exe

          $env:CGO_ENABLED = '1'
          go build -tags fyne -ldflags "-X github.com/fiwon123/crower/cmd.Version=$env:VERSION" -o build/crower-gui.exe ./cmd/crowergui

          Copy-Item build/crower.exe, build/cr.exe, build/crower-gui.exe, scripts/add_to_path.bat, README.md, LICENSE, LICENSE-APACHE, LICENSE-FYNE, NOTICE build/gui-package/
          Push-Location build/gui-package
          Compress-Archive -Path * -DestinationPath "../dist/crower_${env:VERSION}_windows_amd64.zip" -Force
          Pop-Location
          go run ./internal/tools/archiveverify -gui build/dist

      - name: Verify build provenance (Unix)
        if: matrix.goos != 'windows'
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail

          INFO="$(go version -m build/crower-gui)"
          REVISION="$(printf '%s\n' "$INFO" | sed -n 's/.*vcs\.revision=//p')"
          MODIFIED="$(printf '%s\n' "$INFO" | sed -n 's/.*vcs\.modified=//p')"

          if [ -z "$REVISION" ]; then
            echo "::error::build/crower-gui carries no vcs.revision" >&2
            exit 1
          fi

          if [ "$REVISION" != "$EXPECTED_COMMIT" ]; then
            echo "::error::GUI binary was built from $REVISION, expected $EXPECTED_COMMIT" >&2
            exit 1
          fi

          if [ "$MODIFIED" != "false" ]; then
            echo "::error::GUI binary reports vcs.modified=$MODIFIED" >&2
            exit 1
          fi

          echo "provenance OK: built from $REVISION, unmodified"

      - name: Verify build provenance (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $info = go version -m build/crower-gui.exe
          $rev = (($info | Select-String 'vcs.revision=').Line -split 'vcs.revision=')[1].Trim()
          if ([string]::IsNullOrWhiteSpace($rev)) { throw 'GUI binary carries no vcs.revision' }
          if ($rev -ne $env:EXPECTED_COMMIT) { throw "GUI binary was built from $rev, expected $env:EXPECTED_COMMIT" }
          if (-not ($info -match 'vcs.modified=false')) { throw 'GUI binary reports a modified tree' }
          Write-Host "provenance OK: built from $rev, unmodified"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/dist/*

  gui-cross:
    # fyne-cross runs the Fyne build in a Docker image with Zig/MinGW, which is
    # how the two arm64 targets get a real crower-gui. The CLI pair is a plain
    # Go cross-compile. Both go into the same platform archive.
    name: Build GUI ${{ matrix.goos }}/${{ matrix.goarch }} (cross)
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            target: linux
          - goos: windows
            goarch: arm64
            target: windows
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@v1.6.3

      - name: Build crower-gui with fyne-cross
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # fyne-cross v1.6.3 reads GOFLAGS but does not pass it into the
          # container, so the tag travels in a generated init file. It is
          # gitignored, which keeps vcs.modified=false in the binary.
          printf 'package cmd\n\nfunc init() { Version = "%s" }\n' "$VERSION" > cmd/zz_version_generated.go
          trap 'rm -f cmd/zz_version_generated.go' EXIT

          "$(go env GOPATH)/bin/fyne-cross" "${{ matrix.target }}" \
            -arch "${{ matrix.goarch }}" \
            -name crower-gui \
            -app-id com.fiwon123.crower \
            -tags fyne \
            -icon internal/fyneui/logo.png \
            ./cmd/crowergui

      - name: Build the platform archive
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          mkdir -p build
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "-X github.com/fiwon123/crower/cmd.Version=${VERSION}" \
            -o "build/crower${EXT}" .
          cp "build/crower${EXT}" "build/cr${EXT}"

          # fyne-cross names the Linux binary after the package directory.
          GUI="$(find fyne-cross/bin -maxdepth 3 -type f \
            \( -name 'crower-gui*' -o -name 'crowergui*' \) \
            ! -name '*.tar.*' ! -name '*.zip' | head -1)"
          test -n "$GUI"
          cp "$GUI" "build/crower-gui${EXT}"

          make package-gui VERSION="${VERSION}" GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          make verify-release VERSION="${VERSION}" GUI=1

      - name: Verify build provenance
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail

          BIN="build/crower-gui"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN="build/crower-gui.exe"
          fi

          INFO="$(go version -m "$BIN")"
          REVISION="$(printf '%s\n' "$INFO" | sed -n 's/.*vcs\.revision=//p')"
          MODIFIED="$(printf '%s\n' "$INFO" | sed -n 's/.*vcs\.modified=//p')"

          if [ -z "$REVISION" ]; then
            echo "::error::$BIN carries no vcs.revision" >&2
            exit 1
          fi

          if [ "$REVISION" != "$EXPECTED_COMMIT" ]; then
            echo "::error::GUI binary was built from $REVISION, expected $EXPECTED_COMMIT" >&2
            exit 1
          fi

          if [ "$MODIFIED" != "false" ]; then
            echo "::error::GUI binary reports vcs.modified=$MODIFIED" >&2
            exit 1
          fi

          echo "provenance OK: built from $REVISION, unmodified"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gui-cross-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/dist/*

  publish:
    name: Publish release
    needs: [prepare, gui, gui-cross]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > checksums.txt
          ls -lh

      - name: Create professional release notes
        id: notes
        # The body follows docs/release-notes-template.md: section emoji,
        # platform icons and a CLI/GUI table, with a compare link as the
        # changelog. Highlights and Fixes come from the PRs merged into `dev`,
        # so an unedited draft already has the house shape.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          PREV: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          A terminal file manager and command-alias manager with undoable history and per-item notes.

          EOF

          # Highlights and Fixes are the PRs merged into `dev` in this window,
          # labelled `enhancement` and `bug`. `releasehighlights` drops the
          # conventional-commit prefix and capitalises the title; the release
          # manager may still rewrite a line in the draft.
          if [ -n "$PREV" ]; then
            PREV_AT="$(gh api "repos/${REPO}/commits/${PREV}" --jq '.commit.committer.date')"
            END_AT="$(gh api "repos/${REPO}/commits/${COMMIT}" --jq '.commit.committer.date')"
            gh pr list --repo "$REPO" --state merged --base dev --limit 200 \
              --search "merged:>=${PREV_AT}" \
              --json number,title,url,labels,mergedAt \
              | go run ./internal/tools/releasehighlights "${PREV_AT}" "${END_AT}" >> notes.md
          fi

          cat >> notes.md <<'EOF'
          ## 📦 Downloads

          | Platform | CLI | GUI |
          | --- | --- | --- |
          | 🐧 Linux amd64 | `crower_@TAG@_linux_amd64.tar.gz` | `crower_gui_@TAG@_linux_amd64.tar.gz` |
          | 🐧 Linux arm64 | `crower_@TAG@_linux_arm64.tar.gz` | — |
          | 🪟 Windows amd64 | `crower_@TAG@_windows_amd64.zip` | `crower_gui_@TAG@_windows_amd64.zip` |
          | 🪟 Windows arm64 | `crower_@TAG@_windows_arm64.zip` | — |
          | 🍎 macOS Intel | `crower_@TAG@_darwin_amd64.tar.gz` | `crower_gui_@TAG@_darwin_amd64.tar.gz` |
          | 🍎 macOS Apple Silicon | `crower_@TAG@_darwin_arm64.tar.gz` | `crower_gui_@TAG@_darwin_arm64.tar.gz` |

          The CLI archive is cgo-free and ships `crower`, the `cr` alias, README, licenses and the `add_to_path` installer. The GUI archive ships `crower-gui`, the Fyne window over the same configuration, with README and licenses.

          ## ⚙️ Install

          ```sh
          tar -xzf crower_@TAG@_linux_amd64.tar.gz   # .zip on Windows
          ./add_to_path.sh                            # add_to_path.bat on Windows
          crower --version
          ```

          `crower gui` opens the terminal menu; `crower-gui` from the GUI archive opens the Fyne window.

          ## ⚡ Upgrade

          ```sh
          crower --upgrade
          ```

          Verifies the archive against the release's `checksums.txt` before replacing the binary.

          ## 🔐 Verify

          - SHA-256 for every asset: `checksums.txt`.
          - Built from `@COMMIT@` (tag `@TAG@`), `vcs.modified=false`:

          ```sh
          go version -m crower | grep vcs.revision
          ```

          ## 📝 Changelog
          EOF

          # The published body carries a compare link, not a pasted PR list: the
          # list is long, goes stale, and reads worse than the link.
          if [ -z "$PREV" ]; then
            echo "_Initial release or first tagged version._" >> notes.md
          else
            printf '\n[`%s...%s`](https://github.com/%s/compare/%s...%s)\n' "$PREV" "$TAG" "$REPO" "$PREV" "$TAG" >> notes.md
          fi

          sed -i "s|@TAG@|${TAG}|g; s|@REPO@|${REPO}|g; s|@COMMIT@|${COMMIT}|g" notes.md

      - name: Check the release-body shape
        # A generator change that drops a section or reintroduces a badge fails
        # here, before the draft exists. The gate is the one in
        # docs/release-notes-template.md and internal/tools/bodycheck.
        run: go run ./internal/tools/bodycheck notes.md

      # A draft is the default so the artifacts can be inspected — and rebuilt by
      # re-running — before anyone can download them. A published release is
      # never rewritten: that would silently change what a user already has.
      - name: Create or refresh draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published. Bump the version instead of rebuilding it." >&2
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Crower $TAG" --notes-file notes.md
            echo "Refreshed draft release $TAG."
          else
            gh release create "$TAG" \
              --title "Crower $TAG" \
              --notes-file notes.md \
              --draft \
              dist/*
            echo "Created draft release $TAG. Inspect the assets, then publish it."
          fi

      - name: Publish the draft
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG."
