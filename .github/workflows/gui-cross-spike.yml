name: GUI cross spike

# Throwaway verification for #357: can fyne-cross build crower-gui for the two
# arm64 targets on an amd64 runner? Removed before the PR.
on:
  push:
    branches: [feat/357-one-archive-per-platform]

permissions:
  contents: read

jobs:
  cross:
    name: ${{ matrix.target }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: arm64
          - target: windows
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build with fyne-cross
        env:
          VERSION: v0.0.0-test
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/fyne-cross" "${{ matrix.target }}" \
            -arch "${{ matrix.arch }}" \
            -name crower-gui \
            -app-id com.fiwon123.crower \
            -tags fyne \
            -icon internal/fyneui/logo.png \
            -ldflags "-X=github.com/fiwon123/crower/cmd.Version=${VERSION}" \
            ./cmd/crowergui

      - name: Debug the container view
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/app" -w /app \
            fyneio/fyne-cross-images:${{ matrix.target }} \
            -c 'git status --porcelain; echo "--- tracked diff ---"; git diff --stat; echo "--- ignored ---"; git status --porcelain --ignored | head -20'

      - name: Inspect the binary
        run: |
          set -euo pipefail
          echo "--- git status after fyne-cross ---"
          git status --porcelain
          echo "---"
          find fyne-cross/bin -maxdepth 3 -type f -print
          BIN="$(find fyne-cross/bin -maxdepth 3 -type f ! -name '*.tar.*' ! -name '*.zip' | head -1)"
          test -n "$BIN"
          echo "binary: $BIN"
          go version -m "$BIN"
          file "$BIN"
