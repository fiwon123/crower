name: Fyne macOS package spike

# Throwaway verification for the macOS Fyne release job (#333). Removed before
# the PR.
on:
  push:
    branches: [feat/333-fyne-macos]

permissions:
  contents: read

jobs:
  macos:
    name: Package Fyne macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build and package
        env:
          VERSION: v0.0.0-test
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: make release-fyne-platform
      - name: Provenance
        run: go version -m build/crower | grep -E 'vcs.revision|vcs.modified'
      - name: Assets
        run: ls -lh build/dist
