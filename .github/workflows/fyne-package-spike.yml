name: Fyne package spike

# Throwaway verification for the release Fyne job (#325). Dispatch by pushing
# to the branch; removed before the PR.
on:
  push:
    branches: [feat/325-fyne-release]

permissions:
  contents: read

jobs:
  linux:
    name: Package Fyne Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install X11/GL and Wayland headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Build and package
        env:
          VERSION: v0.0.0-test
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '1'
        run: make release-fyne-platform
      - name: Provenance
        run: go version -m build/crower | grep -E 'vcs.revision|vcs.modified'
      - name: Assets
        run: ls -lh build/dist

  windows:
    name: Package Fyne Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build and package
        shell: pwsh
        env:
          VERSION: v0.0.0-test
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          New-Item -ItemType Directory -Force build/dist, build/fyne | Out-Null
          go build -tags fyne -ldflags "-X github.com/fiwon123/crower/cmd.Version=$env:VERSION" -o build/crower.exe .
          Copy-Item build/crower.exe build/cr.exe
          Copy-Item build/crower.exe, build/cr.exe, scripts/add_to_path.bat, README.md, LICENSE, LICENSE-APACHE, NOTICE build/fyne/
          Push-Location build/fyne
          Compress-Archive -Path * -DestinationPath "../dist/crower_fyne_${env:VERSION}_windows_amd64.zip" -Force
          Pop-Location
          go run ./internal/tools/archiveverify build/dist
      - name: Provenance
        shell: pwsh
        run: |
          go version -m build/crower.exe | Select-String 'vcs.revision|vcs.modified'
      - name: Assets
        shell: pwsh
        run: Get-ChildItem build/dist | Select-Object Name,Length
