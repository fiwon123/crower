name: Fyne macOS path spike

# Throwaway verification for the macOS archive member fix (#338). Removed
# before the PR.
on:
  push:
    branches: [fix/338-fyne-macos-paths]

permissions:
  contents: read

jobs:
  macos:
    name: Check Fyne macOS archive paths
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build and package
        env:
          VERSION: v0.0.0-test
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: make release-fyne-platform
      - name: Members
        run: tar -tzf build/dist/crower_fyne_v0.0.0-test_darwin_arm64.tar.gz
      - name: Provenance
        run: go version -m build/crower | grep -E 'vcs.revision|vcs.modified'
