name: Fyne

# The Fyne front end is a CGO build behind `-tags fyne`; the default `CI (Go)`
# job stays cgo-free. This workflow proves the tagged binary builds and its
# headless tests pass on every supported platform (#325, #333, #335).
#
# Manual dispatch only. It used to run on every release pull request, but
# `release.yml` rebuilds the same six archives from the same tag, so the release
# path paid for the CGO compile twice. `release.yml` is the release gate; run
# this one before merging when the change touches `internal/fyneui` or
# `cmd/crowergui`:
#
#   gh workflow run fyne.yml --ref <branch>
#
# A cold run is ~5-7 minutes because the Go build cache is empty; a warm run is
# ~1-3 minutes. The native Windows build is the slowest step when cold.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Fyne Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install X11/GL and Wayland headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev xvfb libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop

      - name: Test the Fyne view headlessly
        run: xvfb-run -a go test -tags fyne ./internal/fyneui

      - name: Capture the tabs
        run: xvfb-run -a go test -tags fyne ./internal/fyneui -run TestScreenshots -v

      - name: Upload the captures
        uses: actions/upload-artifact@v7
        with:
          name: shots
          path: build/shots/*.png

      - name: Test the window startup log
        run: go test -tags fyne ./cmd -run 'TestWindowLog|TestFirstFyneError|TestOrdinaryLogLines'


  windows:
    name: Fyne Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '1'
          go build -tags fyne ./...

      # The release builds this file for double-clicking, so the pull request
      # gate builds it the same way: a GUI subsystem, the crow icon, the
      # manifest and the version. A plain `go build` passes the step above and
      # still ships a console program with no icon (#456).
      - name: Build the window executable with its resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '1'
          New-Item -ItemType Directory -Force build | Out-Null
          go run ./internal/tools/winres -icon internal/fyneui/logo.png -out cmd/crowergui/rsrc_windows_amd64.syso -arch amd64 -name crower-gui -version v0.0.0
          go build -tags fyne -ldflags "-H windowsgui" -o build/crower-gui.exe ./cmd/crowergui
          Remove-Item cmd/crowergui/rsrc_windows_amd64.syso
          go run ./internal/tools/winres -verify build/crower-gui.exe

          # A resource tree the loader rejects still parses, so start the file:
          # --help exits before any window opens, which makes this a load test
          # rather than a GUI test (#462).
          $gui = Start-Process build/crower-gui.exe -ArgumentList '--help' -PassThru
          if (-not $gui.WaitForExit(60000)) {
            $gui.Kill()
            throw 'crower-gui.exe --help did not exit within 60 s'
          }
          if ($gui.ExitCode -ne 0) { throw "crower-gui.exe --help failed (exit $($gui.ExitCode))" }

      # A window that cannot be created is invisible in a GUI-subsystem binary.
      # Start it here for a bounded time and print what it recorded: a runner
      # with no GPU is a useful record of the failure mode (#465).
      - name: Start the window and report its log
        shell: pwsh
        continue-on-error: true
        run: |
          $env:CROWER_GUI_NO_DIALOG = '1'
          $p = Start-Process build/crower-gui.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Host "window run exited early: $($p.ExitCode)"
          } else {
            Write-Host 'window run stayed open'
            $p.Kill()
          }
          $log = Join-Path $env:USERPROFILE 'crower/fyne.log'
          if (Test-Path $log) { Write-Host '--- fyne.log'; Get-Content $log } else { Write-Host 'no fyne.log' }

  macos:
    name: Fyne macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop

  macos-intel:
    name: Fyne macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop

  windows-mingw:
    name: Fyne Windows (mingw cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install the mingw-w64 cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip

      # The release builds the Windows archive this way, so the pull request
      # gate runs the same target: the resource, the GUI subsystem, the
      # architecture check and WINDOWS.txt in the archive (#465).
      - name: Build and verify the Windows archive
        env:
          VERSION: v0.0.0
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
        run: make release-gui-platform
