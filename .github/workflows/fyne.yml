name: Fyne

# The Fyne front end is a CGO build behind `-tags fyne`; the default `CI (Go)`
# job stays cgo-free. This workflow proves the tagged binary builds on the two
# supported platforms (#325).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [feat/333-fyne-macos] # temporary for this PR

permissions:
  contents: read

jobs:
  linux:
    name: Fyne Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install X11/GL and Wayland headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev xvfb libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop

      - name: Test the Fyne view headlessly
        run: xvfb-run -a go test -tags fyne ./internal/fyneui

  windows:
    name: Fyne Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '1'
          go build -tags fyne ./...

  macos:
    name: Fyne macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop
