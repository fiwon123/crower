name: Fyne

# The Fyne front end is a CGO build behind `-tags fyne`; the default `CI (Go)`
# job stays cgo-free. This workflow proves the tagged binary builds on every
# supported platform (#325, #333, #335).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Fyne Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install X11/GL and Wayland headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev xvfb libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop

      - name: Test the Fyne view headlessly
        run: xvfb-run -a go test -tags fyne ./internal/fyneui

  windows:
    name: Fyne Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '1'
          go build -tags fyne ./...

      # The release builds this file for double-clicking, so the pull request
      # gate builds it the same way: a GUI subsystem, the crow icon, the
      # manifest and the version. A plain `go build` passes the step above and
      # still ships a console program with no icon (#456).
      - name: Build the window executable with its resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '1'
          New-Item -ItemType Directory -Force build | Out-Null
          go run ./internal/tools/winres -icon internal/fyneui/logo.png -out cmd/crowergui/rsrc_windows_amd64.syso -arch amd64 -name crower-gui -version v0.0.0
          go build -tags fyne -ldflags "-H windowsgui" -o build/crower-gui.exe ./cmd/crowergui
          Remove-Item cmd/crowergui/rsrc_windows_amd64.syso
          go run ./internal/tools/winres -verify build/crower-gui.exe

  macos:
    name: Fyne macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop

  macos-intel:
    name: Fyne macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build with the fyne tag
        run: CGO_ENABLED=1 go build -tags fyne ./...

      - name: Test the headless model
        run: go test ./internal/desktop

  windows-diag:
    name: Diag Windows window build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build variants and try to start them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '1'
          New-Item -ItemType Directory -Force build | Out-Null

          function Try-Run([string]$path) {
            try {
              $p = Start-Process $path -ArgumentList '--help' -PassThru
              if (-not $p.WaitForExit(30000)) { $p.Kill(); return 'TIMEOUT' }
              return "exit=$($p.ExitCode)"
            } catch {
              return "START FAILED: $($_.Exception.Message)"
            }
          }

          $resource = 'cmd/crowergui/rsrc_windows_amd64.syso'

          go build -tags fyne -o build/a.exe ./cmd/crowergui
          Write-Host "A console-no-resource: $(Try-Run build/a.exe)"

          go run ./internal/tools/winres -icon internal/fyneui/logo.png -out $resource -arch amd64 -name crower-gui -version v0.0.0
          go build -tags fyne -o build/b.exe ./cmd/crowergui
          Write-Host "B console-resource: $(Try-Run build/b.exe)"

          Remove-Item $resource
          go build -tags fyne -ldflags '-H windowsgui' -o build/c.exe ./cmd/crowergui
          Write-Host "C gui-no-resource: $(Try-Run build/c.exe)"

          go run ./internal/tools/winres -icon internal/fyneui/logo.png -out $resource -arch amd64 -name crower-gui -version v0.0.0
          go build -tags fyne -ldflags '-H windowsgui' -o build/d.exe ./cmd/crowergui
          Write-Host "D gui-resource: $(Try-Run build/d.exe)"
          Remove-Item $resource

          foreach ($name in 'a','b','c','d') {
            $bytes = [System.IO.File]::ReadAllBytes("build/$name.exe")
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            $sections = [BitConverter]::ToUInt16($bytes, $pe + 6)
            $opt = $pe + 24
            $subsystem = [BitConverter]::ToUInt16($bytes, $opt + 68)
            Write-Host "$name.exe machine=$('{0:x}' -f $machine) sections=$sections subsystem=$subsystem size=$($bytes.Length)"
          }
