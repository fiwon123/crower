<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Solid black background -->
  <rect width="512" height="512" rx="80" fill="#000000"/>
  
  <!-- Crow head/face - white silhouette -->
  <!-- Main head shape -->
  <ellipse cx="256" cy="230" rx="95" ry="105" fill="#ffffff"/>
  
  <!-- Beak - sharp angular beak -->
  <path d="M 345 230 L 390 225 L 345 245 Z" fill="#ffffff"/>
  
  <!-- Eye socket shadow for depth -->
  <ellipse cx="295" cy="210" rx="18" ry="22" fill="#000000" opacity="0.15"/>
  
  <!-- Eye -->
  <circle cx="295" cy="210" r="14" fill="#000000"/>
  <circle cx="300" cy="205" r="5" fill="#ffffff"/>
  
  <!-- Nostrils -->
  <circle cx="348" cy="232" r="2" fill="#000000"/>
  <circle cx="348" cy="238" r="2" fill="#000000"/>
  
  <!-- Head feather tuft -->
  <path d="M 200 150 Q 210 135 225 145 Q 215 160 200 150" fill="#ffffff"/>
  <path d="M 215 142 Q 230 125 245 138 Q 235 155 215 142" fill="#ffffff"/>
  
  <!-- Command prompt integrated -->
  <g opacity="0.95">
    <path d="M 170 310 L 195 335 L 170 360" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="210" y1="360" x2="240" y2="360" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
