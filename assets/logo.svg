<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">crower</title>
  <desc id="logoDesc">A black crow's head with a teal beak shaped like a prompt, inside a folder.</desc>

  <defs>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- Folder tile -->
  <path d="M64 180 Q64 152 92 152 H190 Q206 152 216 166 L232 186 H420 Q448 186 448 214 V392 Q448 420 420 420 H92 Q64 420 64 392 Z" fill="url(#folder)"/>
  <path d="M64 180 Q64 152 92 152 H190 Q206 152 216 166 L232 186 H420 Q448 186 448 214 V392 Q448 420 420 420 H92 Q64 420 64 392 Z" fill="none" stroke="#94A3B8" stroke-width="5"/>

  <!-- Crow head and neck -->
  <path d="M146 362
    C 128 316, 140 258, 180 226
    C 214 198, 268 192, 308 212
    C 336 226, 354 250, 358 274
    L 358 292
    C 348 318, 326 336, 298 346
    C 272 356, 242 358, 216 350
    L 224 382
    L 146 382 Z" fill="#0F172A"/>

  <!-- Beak: a thick prompt arrow attached to the head -->
  <path d="M336 226 L438 256 L336 286 L336 268 L398 256 L336 244 Z" fill="url(#beak)"/>

  <!-- Eye -->
  <circle cx="300" cy="244" r="6" fill="#F8FAFC"/>
  <circle cx="302" cy="242" r="2" fill="#0891B2"/>
</svg>
