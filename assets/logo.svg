<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16161e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ece6a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#accent)" stroke-width="8"/>
  
  <!-- Crow body -->
  <ellipse cx="256" cy="290" rx="85" ry="95" fill="#c0caf5" opacity="0.9"/>
  
  <!-- Crow head -->
  <circle cx="256" cy="210" r="65" fill="#c0caf5" opacity="0.9"/>
  
  <!-- Beak -->
  <path d="M 310 210 L 350 210 L 310 225 Z" fill="#ff9e64"/>
  
  <!-- Eye -->
  <circle cx="280" cy="200" r="12" fill="#1a1b26"/>
  <circle cx="283" cy="197" r="4" fill="#c0caf5"/>
  
  <!-- Wing -->
  <path d="M 200 280 Q 150 320 170 380 Q 210 340 250 300" fill="#a9b1d6" opacity="0.8"/>
  
  <!-- Command prompt chevron -->
  <path d="M 180 150 L 210 175 L 180 200" stroke="url(#accent)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Underscore/cursor -->
  <line x1="220" y1="200" x2="250" y2="200" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Tail feathers -->
  <path d="M 280 370 Q 290 400 300 420 Q 285 395 275 370" fill="#a9b1d6"/>
  <path d="M 270 375 Q 275 405 280 425 Q 270 400 265 375" fill="#a9b1d6"/>
</svg>
